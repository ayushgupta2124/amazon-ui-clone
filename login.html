<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            background: #2205;
            background: linear-gradient(228deg, rgba(34, 34, 0, 1) 0%, rgba(4, 23, 54, 1) 0%, rgba(34, 47, 61, 0.98) 40%);
        }
           
        #login-page{
            margin-top: 20px;
            height: 500px;
            width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 0 15px #f1f1f1;
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
            color:#ffff;
            text-decoration: underline blueviolet ; 
            padding-top: 30px;
            background: #220533;
            background: linear-gradient(228deg, rgba(34, 5, 51, 1) 0%, rgba(4, 23, 54, 1) 99%, rgba(33, 22, 3, 0.98) 100%);
        

            
        }
        input{
            height: 40px;
            width: 200px;
            border: none;
            background: none;
            border-bottom: 2px solid rgb(71, 65, 65);
            font-size: 15px;
            transition: 2s; 
            color: white;  
            outline:none;
            
                
        }
        
        button {
            height: 50px;
            width: 100px;
            border:none;
            border-radius: 18px;
            font-size: larger;
            background: rgb(140, 202, 140);
            transition: linear 3s;
            box-shadow: inset 0 0 12px  rgb(140, 202, 140);;
        }
        button:active{
            transform: scale(1.4);
        }
       
    </style>
</head>
<body>
    <div id="login-page">
        <h2><i>Login Page</i></h2>
        <br><br>
        <div class="email">
        <input type="email" , placeholder="Email"> 
        </div>
        <div class="password">
        <input type="password" , placeholder="Password">
        </div>
        <div class="button">
        <button>Login</button>
        </div>
        </div>
    </div>
</body>
</html>
